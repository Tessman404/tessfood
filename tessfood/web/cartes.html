<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tessfood — cartes de mode</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:20px;color:#1d2a24}
h1{font-size:1.3rem;margin:0 0 4px}
p{margin:0 0 16px;color:#5d6b64}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{border:2px dashed #1f3b30;border-radius:14px;padding:14px;text-align:center;break-inside:avoid}
.card b{display:block;font-size:1.35rem;margin-bottom:2px}
.card small{display:block;color:#5d6b64;margin-bottom:8px}
svg{width:100%;height:70px}
.code{font:12px monospace;color:#5d6b64}
button{padding:10px 16px;border-radius:10px;border:0;background:#1f3b30;color:#fff;font-weight:600;margin-bottom:16px}
@media print{button,p{display:none}}
</style>
</head>
<body>
<h1>Cartes de mode Tessfood</h1>
<p>Imprime, découpe et colle-les près du scanner. Scanne une carte, puis le(s) produit(s). Sans carte, un scan = sortie du stock. La carte reste active 90 secondes après le dernier scan.</p>
<button onclick="print()">Imprimer</button>
<div class="grid" id="g"></div>
<script>
// Code 128 (jeu B) dessiné en SVG
const P = ['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128(txt) {
  const vals = [104]; for (const c of txt) vals.push(c.charCodeAt(0) - 32);
  let sum = 104; for (let i = 1; i < vals.length; i++) sum += vals[i] * i;
  vals.push(sum % 103, 106);
  const widths = vals.map(v => P[v]).join('');
  let x = 10, bars = '';
  for (let i = 0; i < widths.length; i++) { const w = +widths[i]; if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="60"/>`; x += w; }
  return `<svg viewBox="0 0 ${x + 10} 60" preserveAspectRatio="none">${bars}</svg>`;
}
const C = [['TF-SORTIE', 'SORTIE', 'Mode par défaut : retire du stock'], ['TF-AJOUT', 'AJOUTER', 'Ajoute au stock'],
           ['TF-OUVERT', 'OUVERT', 'Marque le produit comme entamé'], ['TF-JETE', 'JETÉ', 'Périmé / gaspillé'], ['TF-FINI', 'FINI', 'Plus rien : stock à 0'],
           ['TF-ANNULER', 'ANNULER', 'Défait le dernier scan']];
document.getElementById('g').innerHTML = C.map(([c, t, s]) => `<div class="card"><b>${t}</b><small>${s}</small>${code128(c)}<div class="code">${c}</div></div>`).join('');
</script>
</body>
</html>
